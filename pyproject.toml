[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-agent-office"
version = "0.1.0"
description = "FlopOffice M1 — DID identity, canonical Technocore signing, and an append-only proof ledger."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pre-commit>=3.7",
]

[project.scripts]
flopoffice = "flopoffice.__main__:main"

[tool.setuptools]
packages = ["flopoffice", "identity", "technocore", "proof", "storage", "config", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a locally reachable Technocore instance",
]
filterwarnings = ["error::DeprecationWarning"]
