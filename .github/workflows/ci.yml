name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Runs before the tests: a leaked secret must fail the build at the
      # earliest possible point, and the scanner never prints what it matched.
      - name: Secret scan
        run: python tools/secret_scan.py --all

      - name: Refuse key-shaped files in the tree
        run: |
          if git ls-files | grep -Ei '\.(pem|key|jwk|p8|p12|pfx|keystore)$|(^|/)\.env$'; then
            echo "key-shaped files are tracked" >&2
            exit 1
          fi

      - name: Tests
        run: python -m pytest -q

      # Integration runs against the loopback stand-in only. CI must never
      # depend on, or contact, the public technocore.chat instance.
      - name: Confirm no public Technocore host is configured
        run: |
          if [ -n "${TECHNOCORE_BASE_URL:-}" ]; then
            echo "TECHNOCORE_BASE_URL must not be set in CI" >&2
            exit 1
          fi

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
